openapi: 3.1.0
info:
  title: Medical AI Consultation API
  version: "1.0.0"
  description: |
    سرویس مشاوره پزشکی هوشمند به زبان فارسی با تخصص per-body-part.
    مدل: Med42-v2-70B-AWQ + Per-Specialty RAG + Guardrails.
    تمام پاسخ‌ها شامل disclaimer قوی هستند. Safety violation rate باید صفر باشد.
  contact:
    name: AI Team - Oppie (Director of AI)
    email: ai-lead@company.ir

servers:
  - url: https://ai-medical.internal.company.ir
    description: Production Server (self-hosted)

security:
  - ApiKeyAuth: []
  - CorrelationID: []

paths:
  /v1/medical/consult:
    post:
      summary: مشاوره پزشکی (Streaming + Structured Output)
      description: دریافت query فارسی + تاریخچه + عضو بدن (اختیاری). پاسخ به صورت streaming SSE برمی‌گردد و در انتها Structured JSON کامل ارسال می‌شود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicalConsultRequest'
            examples:
              chest_pain:
                summary: "مثال درد قفسه سینه (فارسی)"
                value:
                  user_id: "usr_98765"
                  session_id: "sess_abc123xyz"
                  query: "از دیشب درد شدید قفسه سینه دارم که به دست چپم می‌زنه، همراه تنگی نفس."
                  selected_body_part: "heart"
                  language: "fa"
      responses:
        '200':
          description: Streaming Response (SSE)
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamChunk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimit'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/health:
    get:
      summary: وضعیت سرویس و GPU
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    CorrelationID:
      type: apiKey
      in: header
      name: X-Correlation-ID

  schemas:
    MedicalConsultRequest:
      type: object
      required: ["user_id", "session_id", "query"]
      properties:
        user_id:
          type: string
          example: "usr_98765"
        session_id:
          type: string
          example: "sess_abc123xyz"
        query:
          type: string
          example: "درد قفسه سینه دارم..."
        chat_history:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        selected_body_part:
          type: string
          enum: [heart, skin, digestive, bone_joint, respiratory, endocrine, neurological, eye, ent, kidney, general, other]
        language:
          type: string
          default: "fa"
        temperature:
          type: number
          default: 0.7

    ChatMessage:
      type: object
      properties:
        role: { type: string, enum: ["user", "assistant"] }
        content: { type: string }

    StreamChunk:
      type: object
      properties:
        type:
          type: string
          enum: ["thinking", "retrieving", "content", "structured", "done", "error"]
        content:
          type: string
        structured:
          $ref: '#/components/schemas/StructuredMedicalResponse'
        correlation_id:
          type: string

    StructuredMedicalResponse:
      type: object
      required: ["summary", "recommendations", "urgency", "disclaimer"]
      properties:
        summary:
          type: string
        recommendations:
          type: array
          items: { type: string }
        urgency:
          type: string
          enum: ["low", "medium", "high", "emergency"]
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        disclaimer:
          type: string
          example: "این مشاوره جایگزین تشخیص و ویزیت حضوری پزشک متخصص نیست. در موارد اورژانسی فوراً به نزدیک‌ترین مرکز درمانی مراجعه کنید."
        needs_human_review:
          type: boolean
          default: false
        detected_specialty:
          type: string
        confidence_score:
          type: number
          minimum: 0
          maximum: 1

    Source:
      type: object
      properties:
        title: { type: string }
        link: { type: string, format: uri }
        snippet: { type: string }

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: "healthy" }
        model: { type: string, example: "Med42-v2-70B-AWQ" }
        gpu_utilization: { type: number }
        concurrent_users: { type: integer }

  responses:
    BadRequest:
      description: درخواست نامعتبر
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, example: "invalid_query_or_missing_user_id" }
    RateLimit:
      description: Rate limit exceeded
    InternalError:
      description: خطای داخلی (شامل safety violation)

tags:
  - name: Medical Consultation
    description: تمام endpointهای مرتبط با مشاوره پزشکی