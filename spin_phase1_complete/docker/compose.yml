# docker/compose.yml
version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: medical_vllm_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    # مپ کردن پوشه مدل‌ها تا هر بار مجبور به دانلود مدل سنگین نشوید
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # دستورات اجرایی vLLM برای بهینه‌سازی روی GPU 
    command: >
      --model Qwen/Qwen2.5-32B-Instruct-AWQ
      --max-model-len 4096
      --gpu-memory-utilization 0.9
      --max-num-seqs 16

  # اضافه شد: برای RAG (app/rag/qdrant_client.py) و اگر بعدا کش معنایی هم
  # روی همین قرار گرفت. بدون GPU لازم است، سبک است.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: medical_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST/gRPC که app/rag/qdrant_client.py به آن وصل می‌شود
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # مانیتورینگ (اختیاری ولی توصیه‌شده). خود سرویس FastAPI روی هاست اجرا
  # می‌شود (uvicorn، نه داخل این compose)، برای همین targets در
  # prometheus.yml روی host.docker.internal تنظیم شده - اگر سرویس هم به
  # همین compose اضافه شد، آن را عوض کنید.
  prometheus:
    image: prom/prometheus:latest
    container_name: medical_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # برای لینوکس لازم است؛ روی مک/ویندوز خودکار است

  grafana:
    image: grafana/grafana:latest
    container_name: medical_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=change-me
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  qdrant_storage:
  prometheus_data:
  grafana_data:

#docker-compose -f docker/compose.yml up -d
